name: EBU specification freshness

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ebu-specification-freshness
  cancel-in-progress: false

jobs:
  check-upstream:
    name: Check EBU specification sources
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check local integrity and upstream freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run spec:check:upstream
